[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
# Paris keeps the bytecode free of opcodes a destination chain might not have yet.
evm_version = "paris"
# The tests load the bytecode of Morpho Blue as deployed on Base Sepolia.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
bytecode_hash = "none"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@reactive/=lib/reactive-lib-omni/",
  "morpho-blue/=lib/morpho-blue/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
lasna = "https://lasna-rpc.rnk.dev/"
base_sepolia = "https://sepolia.base.org"

[fmt]
line_length = 120
