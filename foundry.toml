[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Two compilers on purpose: our contracts need ^0.8.29 (reactive-lib-omni), and the tests deploy the
# real Morpho Blue, which is pinned to 0.8.19. Paris is the newest EVM version 0.8.19 can target.
auto_detect_solc = true
evm_version = "paris"
bytecode_hash = "none"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@reactive/=lib/reactive-lib-omni/",
  "morpho-blue/=lib/morpho-blue/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
lasna = "https://lasna-rpc.rnk.dev/"
base_sepolia = "https://sepolia.base.org"

[fmt]
line_length = 120
